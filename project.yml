name: GooglyEyes
options:
  bundleIdPrefix: co.visionairy.googly
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GooglyEyes:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: Shared
      - path: iOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.visionairy.googly.phone
        PRODUCT_NAME: Bluey
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NF73NSV867
        # Set your team in Xcode (Signing & Capabilities) the first time you run it.
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Bluey
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarHidden: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Bluey finds the Mac app on your Wi-Fi so the character can look where it points.
        NSMicrophoneUsageDescription: Talk to your blueberry. He listens while he's awake (double tap him to wake him up or put him to sleep).
        NSSpeechRecognitionUsageDescription: Bluey transcribes your questions on-device when you hold his face to ask something.
        NSBonjourServices:
          - _googly._tcp
        UIAppFonts:
          - Fredoka.ttf
          - IBMPlexSans.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
